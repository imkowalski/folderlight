name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: node --test scripts/search-ui.test.cjs
      - run: |
          for script in scripts/build.sh scripts/update.sh deploy/folderlight.openrc; do
            sh -n "$script"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - run: sh scripts/build.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/folderlight-linux-amd64.tar.gz \
            dist/folderlight-linux-arm64.tar.gz \
            dist/SHA256SUMS
