name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: node --test scripts/*.test.cjs
      - run: |
          for script in scripts/build.sh scripts/update.sh deploy/folderlight.openrc; do
            sh -n "$script"
          done

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - name: Build static media integration test
        run: CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/media.test"
      - name: Verify optional decoders on Alpine
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" -w /work \
            -v "$RUNNER_TEMP/media.test:/media.test:ro" \
            -e FOLDERLIGHT_MEDIA_TEST=1 alpine:3.24 \
            sh -ec 'apk add --no-cache ffmpeg libheif-tools libraw-tools exiftool; /media.test -test.run TestRealMediaDecoders -test.v'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, media]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - run: sh scripts/build.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/folderlight-linux-amd64.tar.gz \
            dist/folderlight-linux-arm64.tar.gz \
            dist/SHA256SUMS
